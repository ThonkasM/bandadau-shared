# Plantilla de CI para bandadau-shared → copiar a bandadau-shared/.github/workflows/ci.yml
# lint + test + build (sin despliegue; el despliegue AWS es de una fase posterior).
name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Layout de hermanos: $GITHUB_WORKSPACE/{<este-repo>,bandadau-shared,bandadau-docs} (ADR-0017).
      # Si los repos son privados, crea el secreto CI_REPOS_TOKEN (PAT con lectura de la organización).
      - uses: actions/checkout@v4
        with: { path: bandadau-shared }
      - uses: actions/checkout@v4
        with: { repository: '${{ github.repository_owner }}/bandadau-docs', path: bandadau-docs, token: '${{ secrets.CI_REPOS_TOKEN || github.token }}' }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bandadau-shared/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: bandadau-shared/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: bandadau-shared
      - run: pnpm contracts:gen && git diff --exit-code packages/contracts-ts   # contratos-ts al día con bandadau-docs
        working-directory: bandadau-shared
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm i18n:check && pnpm build
        working-directory: bandadau-shared
